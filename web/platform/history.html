<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生成历史 · 萌宠生成测试台</title>
  <style>
    :root {
      --bg: #f5f2eb;
      --paper: rgba(255, 255, 255, .94);
      --ink: #27251f;
      --muted: #756f64;
      --line: #ded8cc;
      --brand: #df6b48;
      --brand-dark: #a84329;
      --green: #2d7a5e;
      --blue: #376f9f;
      --red: #a53224;
      --shadow: 0 18px 50px rgba(73, 57, 34, .10);
      --checker: repeating-conic-gradient(#e9e9e7 0 25%, #fff 0 50%) 0/24px 24px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(249, 190, 115, .24), transparent 32rem),
        radial-gradient(circle at 100% 15%, rgba(110, 173, 151, .20), transparent 34rem),
        var(--bg);
      font: 15px/1.55 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .shell { width: min(1440px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 52px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(27px, 3vw, 42px); letter-spacing: -.04em; }
    h2, h3 { margin: 0; }
    .subtitle { margin: 7px 0 0; color: var(--muted); }
    .back-link {
      display: inline-flex; align-items: center; padding: 10px 15px; border: 1px solid #cbbca5;
      border-radius: 999px; color: var(--ink); background: #fffdf8; text-decoration: none;
      font-weight: 800; white-space: nowrap;
    }
    .back-link:hover { border-color: var(--brand); color: var(--brand-dark); background: #fff5ee; }
    .card { border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); }
    .toolbar { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(3, minmax(130px, 1fr)) auto; gap: 12px; padding: 16px; align-items: end; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    input, select {
      width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 10px 11px;
      color: var(--ink); background: white; outline: none;
    }
    input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(223,107,72,.12); }
    .refresh, .pager button, .detail-button, .close-button {
      border: 1px solid #cbbca5; border-radius: 11px; padding: 10px 14px; color: var(--ink);
      background: #fffdf8; cursor: pointer; font-weight: 800;
    }
    .refresh:hover, .pager button:hover:not(:disabled), .detail-button:hover, .close-button:hover {
      border-color: var(--brand); color: var(--brand-dark); background: #fff5ee;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 18px 2px 12px; color: var(--muted); }
    .summary strong { color: var(--ink); }
    .history-list { display: grid; gap: 16px; }
    .history-card {
      display: grid; grid-template-columns: minmax(240px, 330px) minmax(0, 1fr);
      overflow: hidden; border: 1px solid var(--line); border-radius: 19px; background: var(--paper);
      box-shadow: 0 10px 30px rgba(73,57,34,.07);
    }
    .preview {
      position: relative; min-height: 270px; display: grid; place-items: stretch; overflow: hidden;
      background: var(--checker); border-right: 1px solid var(--line);
    }
    .preview-media-grid { width: 100%; min-height: 270px; display: grid; grid-template-columns: 1fr; }
    .preview-media-grid.multi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .preview-media-item {
      position: relative; min-width: 0; min-height: 135px; display: grid; place-items: center;
      overflow: hidden; background: var(--checker);
    }
    .preview-media-grid.multi .preview-media-item { border: solid rgba(222,216,204,.9); border-width: 0 1px 1px 0; }
    .preview-media-item > a { width: 100%; height: 100%; display: grid; place-items: center; }
    .preview img, .preview video { width: 100%; height: 100%; max-height: 340px; object-fit: contain; display: block; }
    .preview-media-grid.multi img, .preview-media-grid.multi video { max-height: 180px; }
    .media-label {
      position: absolute; z-index: 1; left: 8px; top: 8px; max-width: calc(100% - 16px); padding: 4px 7px;
      border-radius: 8px; color: white; background: rgba(39,37,31,.76); font-size: 11px; font-weight: 800;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
    }
    .preview-count {
      position: absolute; right: 10px; bottom: 10px; padding: 5px 9px; border-radius: 999px;
      color: white; background: rgba(39,37,31,.76); font-size: 12px; font-weight: 800;
    }
    .missing { min-height: 170px; display: grid; place-items: center; padding: 20px; color: var(--muted); text-align: center; }
    .history-content { padding: 18px 20px; min-width: 0; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .card-top h2 { font-size: 17px; overflow-wrap: anywhere; }
    .time { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .status { display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; background: #eee; }
    .status.completed { color: var(--green); background: #e8f4ef; }
    .status.failed { color: var(--red); background: #fff0ed; }
    .status.cancelled { color: #765f3e; background: #f5eee2; }
    .status.running, .status.queued { color: var(--blue); background: #eaf3fb; }
    .prompt {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      margin: 14px 0 12px; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 9px 0; }
    .chip { max-width: 100%; padding: 5px 9px; border-radius: 999px; background: #f0ece4; color: #5d5549; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip.user { color: #7d3f29; background: #fff0e9; }
    .chip.builtin { color: #236b51; background: #e9f5ef; }
    .chip.workflow { color: #45678c; background: #edf3fa; }
    .chip.inactive { opacity: .55; text-decoration: line-through; }
    .card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 14px; }
    .job-id { color: var(--muted); font: 12px/1.4 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
    .detail-button { flex: 0 0 auto; padding: 8px 12px; }
    .notice, .empty, .loading {
      min-height: 240px; display: grid; place-items: center; padding: 32px; border: 1px dashed #cbbca5;
      border-radius: 18px; color: var(--muted); background: rgba(255,255,255,.62); text-align: center;
    }
    .notice { min-height: auto; display: none; color: var(--red); border-style: solid; border-color: #e7b5aa; background: #fff3f0; }
    .notice button { margin-top: 10px; }
    .status.pending_review { color: #76520b; background: #fff3cf; }
    .status.blocked, .status.moderation_error { color: var(--red); background: #fff0eb; }
    .review-note { width: 100%; min-height: 80px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    .review-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .review-message { margin: 8px 0; color: var(--muted); }
    .audit-json { max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; }
    .loading::before { content: "正在读取历史记录…"; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 18px; }
    .pager span { min-width: 120px; color: var(--muted); text-align: center; }
    dialog {
      width: min(1180px, calc(100% - 24px)); max-height: calc(100vh - 28px); padding: 0;
      border: 1px solid var(--line); border-radius: 22px; color: var(--ink); background: #fbfaf7;
      box-shadow: 0 30px 90px rgba(36,28,17,.3);
    }
    dialog::backdrop { background: rgba(33,28,22,.58); backdrop-filter: blur(3px); }
    .dialog-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
    .dialog-head h2 { font-size: 18px; overflow-wrap: anywhere; }
    .close-button { padding: 7px 11px; }
    .dialog-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(330px, .8fr); gap: 18px; padding: 18px; overflow: auto; }
    .main-image {
      min-height: 430px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line);
      border-radius: 16px; background: var(--checker);
    }
    .main-image > a { width: 100%; display: grid; place-items: center; }
    .main-image img, .main-image video { width: 100%; max-height: 620px; object-fit: contain; display: block; }
    .thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 9px; }
    .thumb {
      aspect-ratio: 1; padding: 0; overflow: hidden; border: 2px solid transparent; border-radius: 10px;
      background: var(--checker); cursor: pointer;
    }
    .thumb.active { border-color: var(--brand); }
    .thumb img, .thumb video { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
    .metadata { min-width: 0; }
    .section { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .section:first-child { padding-top: 0; }
    .section:last-child { border-bottom: 0; }
    .section h3 { margin-bottom: 8px; font-size: 15px; }
    .full-prompt { margin: 0; padding: 11px 12px; border-radius: 11px; background: white; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
    .recovery-note { margin-top: 9px; padding: 9px 10px; border-radius: 10px; color: #805118; background: #fff6df; font-size: 12px; }
    dl { display: grid; grid-template-columns: minmax(110px, .8fr) minmax(0, 1.2fr); gap: 7px 12px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .output-links { display: grid; gap: 7px; }
    .output-links a { color: var(--brand-dark); text-decoration: none; overflow-wrap: anywhere; }
    .output-links a:hover { text-decoration: underline; }
    @media (max-width: 900px) {
      header { flex-direction: column; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar label:first-child { grid-column: 1 / -1; }
      .history-card { grid-template-columns: 250px minmax(0, 1fr); }
      .dialog-body { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .shell { width: min(100% - 18px, 1440px); padding-top: 18px; }
      .toolbar { grid-template-columns: 1fr; }
      .toolbar label:first-child { grid-column: auto; }
      .history-card { grid-template-columns: 1fr; }
      .preview { min-height: 240px; border-right: 0; border-bottom: 1px solid var(--line); }
      .card-top, .card-bottom { align-items: flex-start; flex-direction: column; }
      .detail-button { width: 100%; }
      .summary { align-items: flex-start; flex-direction: column; }
      .dialog-body { padding: 12px; }
      .main-image { min-height: 300px; }
      .thumbs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      dl { grid-template-columns: 1fr; gap: 2px; }
      dd { margin-bottom: 7px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>历史生成媒体</h1>
        <p class="subtitle">按任务查看已生成图片、GIF、视频、提示词，以及当时保存的请求参数。</p>
      </div>
      <a class="back-link" href="./">返回生成测试台</a>
    </header>

    <section class="card toolbar" aria-label="历史筛选">
      <label>搜索
        <input id="search" type="search" maxlength="200" placeholder="提示词、任务 ID 或 LoRA 文件名">
      </label>
      <label>任务来源
        <select id="kind">
          <option value="all">全部任务</option>
          <option value="image">图片任务</option>
          <option value="video">视频任务</option>
        </select>
      </label>
      <label>任务状态
        <select id="state">
          <option value="all">全部状态</option>
          <option value="pending_review">待人工复核</option>
          <option value="blocked">已拦截</option>
          <option value="moderation_error">审核异常</option>
          <option value="completed">已完成</option>
          <option value="failed">失败但已有媒体</option>
          <option value="cancelled">已取消但已有媒体</option>
          <option value="active">进行中且已有媒体</option>
        </select>
      </label>
      <label>用户 LoRA
        <select id="lora">
          <option value="all">全部</option>
          <option value="used">使用用户 LoRA</option>
          <option value="none">未使用用户 LoRA</option>
        </select>
      </label>
      <button id="refresh" class="refresh" type="button">刷新</button>
    </section>

    <div class="summary">
      <div id="summary"><strong>正在读取…</strong></div>
      <div>页面展示的是任务保存的请求参数；自动恢复后最终参数可能不同。</div>
    </div>
    <div id="error" class="notice" role="alert"></div>
    <div id="loading" class="loading"></div>
    <div id="empty" class="empty" hidden>
      <div><div style="font-size:48px">🐾</div><p id="emptyText">完成一次生成后，图片、GIF 或视频会出现在这里。</p></div>
    </div>
    <main id="historyList" class="history-list" hidden></main>
    <nav class="pager" aria-label="历史分页">
      <button id="previous" type="button" disabled>上一页</button>
      <span id="pageText">第 1 页</span>
      <button id="next" type="button" disabled>下一页</button>
    </nav>
  </div>

  <dialog id="detail">
    <div class="dialog-head">
      <h2 id="detailTitle">任务详情</h2>
      <button id="closeDetail" class="close-button" type="button">关闭</button>
    </div>
    <div id="detailBody" class="dialog-body"></div>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    const basePath = window.location.pathname.replace(/\/history\/?$/, '');
    const historyState = {
      cursor: null,
      cursorStack: [],
      nextCursor: null,
      page: 1,
      controller: null,
      searchTimer: null,
      items: []
    };

    const statusLabels = {
      pending_review: '待人工复核',
      blocked: '已拦截',
      moderation_error: '审核异常',
      completed: '已完成',
      failed: '生成失败',
      cancelled: '已取消',
      running: '生成中',
      queued: '排队中',
      unknown: '状态未知'
    };
    const outputLabels = {
      moderation_input: '上传原图（审核输入）',
      cartoon_reference: '卡通角色基准图',
      subject_reference: 'SCAIL 主体参考图（身份/外观）',
      subject_reference_mask: 'SCAIL 主体参考遮罩（身份/外观区域）',
      reference_identity_mask: 'SCAIL 主体参考遮罩（身份/外观区域）',
      main_case_geometry_guide: 'Main_case 动作几何引导图（姿态/道具/机位）',
      main_case_geometry_mask: 'Main_case 动作几何遮罩（主体/道具区域）',
      final_video_fur_surface_audit: '最终视频毛发表面抽帧审计（JSON）',
      uploaded_identity_cutout: '上传主体抠图（身份唯一来源）',
      uploaded_identity_reference_input: '上传主体 SCAIL 输入参考（非默认主体）',
      eating_geometry_guide: 'Main_case 吃饭几何引导图（姿态/道具/机位）',
      grooming_geometry_guide: 'Main_case 舔毛几何引导图（姿态/道具/机位）',
      driving_template_preview: 'Main_case 动作标准预览（姿态/道具/机位）',
      standard_direct_reference: 'Main_case 主体与动作标准参考图',
      standard_direct_selected_frame: 'Main_case 主体与动作标准代表帧',
      standard_direct_mask: 'Main_case 主体与道具标准蒙版',
      standard_direct_provenance: 'Main_case 标准直出溯源（JSON）',
      transparent_keyframe: '透明姿态首帧',
      keyframe: '姿态首帧',
      image: '未抠图姿态图',
      transparent_image: '透明图片',
      transparent_gif: '透明 GIF',
      transparent_apng: '透明 APNG',
      subject_replacement_video: '主体替换 MP4',
      video_preview: '视频预览',
      video: '视频'
    };
    const actionLabels = {
      eating: '吃饭',
      eat: '吃饭',
      grooming: '舔毛',
      groom: '舔毛',
      licking: '舔毛'
    };
    const parameterLabels = {
      seed: '随机种子',
      image_profile: '图片基准配置',
      image_profile_revision: '图片基准版本',
      pose_prompt_source: '姿态提示词来源',
      pose_preset_ids: '姿态模板 ID',
      pose_seed_offsets: '姿态种子偏移',
      identity_palette_guard: '毛色身份保护',
      identity_palette_policy: '毛色身份策略',
      source_identity_palette: '参考图毛色签名',
      effective_canonical_identity_palette: '基准图毛色校验',
      canonical_identity_palette_verdict: '基准图毛色结论',
      pose_identity_palette_warning_count: '姿态毛色告警数',
      pose_count: '姿态数量',
      poses: '原始姿态',
      poses_en: '英文生图姿态',
      resolution: '输出分辨率',
      width: '宽度',
      height: '高度',
      output_format: '输出格式',
      skip_video: '跳过视频',
      generation_mode: '生成模式',
      actions: '动作',
      subject_profile: '主体配置',
      subject_source: '主体来源',
      requested_subject_source: '请求主体来源',
      effective_subject_source: '实际主体来源',
      driving_templates: 'Main_case 动作标准（姿态/道具/机位）',
      generation_engine: 'SCAIL 引擎',
      scail_steps: 'SCAIL 步数',
      pose_strength: '动作跟随强度',
      qwen_steps: 'Qwen 步数',
      qwen_cfg: 'Qwen CFG',
      qwen_denoise: 'Qwen 重绘强度',
      qwen_sampler: 'Qwen 采样器',
      qwen_scheduler: 'Qwen 调度器',
      qwen_style_profile: 'Qwen 风格配置',
      qwen_model: 'Qwen 模型',
      wan_steps: 'Wan 步数',
      wan_cfg: 'Wan CFG',
      wan_shift: 'Wan Shift',
      frames: '视频帧数',
      fps: '视频 FPS',
      duration_seconds: '视频时长（秒）'
    };
    const parameterOrder = Object.keys(parameterLabels);
    const subjectParameterOrder = [
      'generation_mode', 'actions', 'subject_profile',
      'requested_subject_source', 'effective_subject_source', 'subject_source',
      'driving_templates', 'generation_engine', 'scail_steps', 'pose_strength',
      'seed', 'resolution', 'width', 'height', 'output_format', 'frames', 'fps',
      'duration_seconds'
    ];

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function formatDate(value) {
      if (!value) return '历史任务未记录';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return new Intl.DateTimeFormat('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
      }).format(date);
    }

    function formatValue(value) {
      if (value === null || value === undefined || value === '') return '历史任务未记录';
      if (Array.isArray(value)) return value.length ? value.join('\n') : '无';
      if (typeof value === 'boolean') return value ? '是' : '否';
      if (typeof value === 'object') {
        try {
          return JSON.stringify(value, null, 2);
        } catch (_) {
          return String(value);
        }
      }
      return String(value);
    }

    function itemParameter(item, key) {
      const parameters = item && item.parameters && typeof item.parameters === 'object'
        ? item.parameters
        : {};
      const value = parameters[key];
      return value === null || value === undefined ? item?.[key] : value;
    }

    function parseActions(value) {
      if (Array.isArray(value)) return value.map(String).filter(Boolean);
      if (value === null || value === undefined || value === '') return [];
      if (typeof value === 'string') {
        const trimmed = value.trim();
        if (trimmed.startsWith('[')) {
          try {
            const parsed = JSON.parse(trimmed);
            if (Array.isArray(parsed)) return parsed.map(String).filter(Boolean);
          } catch (_) {
            // 旧任务可能保存为逗号分隔文本，继续使用下面的兼容路径。
          }
        }
        return trimmed.split(/[,，、/]+/).map(item => item.trim()).filter(Boolean);
      }
      return [String(value)];
    }

    function actionLabel(value, includeKey = false) {
      const key = String(value || '').trim();
      const label = actionLabels[key.toLowerCase()] || key || '动作未记录';
      return includeKey && label !== key ? `${label}（${key}）` : label;
    }

    function itemActions(item, includeKeys = false) {
      const actions = parseActions(itemParameter(item, 'actions'));
      return actions.map(action => actionLabel(action, includeKeys)).join('、');
    }

    function generationMode(item) {
      return String(itemParameter(item, 'generation_mode') || '').trim().toLowerCase();
    }

    function isSubjectReplacement(item) {
      return generationMode(item) === 'subject_replacement';
    }

    function engineLabel(value) {
      const raw = String(value || '').trim();
      if (!raw) return '历史任务未记录';
      if (raw.toLowerCase() === 'scail2-14b-fp8') return 'SCAIL‑2 14B FP8（scail2-14b-fp8）';
      return raw;
    }

    function parameterValue(item, key) {
      const value = itemParameter(item, key);
      if (key === 'generation_mode' && String(value || '').toLowerCase() === 'subject_replacement') {
        return '主体替换（subject_replacement）';
      }
      if (key === 'actions') return itemActions(item, true) || value;
      if (key === 'generation_engine') return engineLabel(value);
      if (
        key === 'subject_source'
        || key === 'requested_subject_source'
        || key === 'effective_subject_source'
      ) {
        if (value === 'profile') return '主体配置（profile）';
        if (value === 'upload') return '本次上传（upload）';
        if (value === 'upload_pending_qwen') return '本次上传（正在生成 Qwen 参考）';
        if (value === 'qwen_generated_upload') return '本次上传（Qwen 参考已生成）';
      }
      if (key === 'driving_templates' && value && typeof value === 'object' && !Array.isArray(value)) {
        return Object.entries(value)
          .map(([action, template]) => `${actionLabel(action, true)}：${template}`)
          .join('\n');
      }
      return value;
    }

    function isVideoMedia(output) {
      if (!output) return false;
      if (output.media_kind === 'video') return true;
      if (['video', 'video_preview', 'subject_replacement_video'].includes(output.type)) return true;
      const path = String(output.filename || output.download_url || '').split(/[?#]/, 1)[0];
      return /\.(mp4|webm|mov|mkv)$/i.test(path);
    }

    function itemMedia(item) {
      if (Array.isArray(item.media)) return item.media.filter(Boolean);
      const images = Array.isArray(item.images) ? item.images : [];
      const videos = Array.isArray(item.videos) ? item.videos : [];
      return [...images, ...videos].filter(Boolean);
    }

    function mediaIdentity(output) {
      return `${output?.media_kind || ''}|${output?.filename || output?.download_url || ''}`;
    }

    function cardMedia(item) {
      const all = itemMedia(item);
      const usable = all.filter(output => output.available !== false);
      const source = usable.length ? usable : all;
      if (!source.length) return [];

      if (isSubjectReplacement(item)) {
        const selected = [];
        const seen = new Set();
        const add = output => {
          if (!output) return;
          const identity = mediaIdentity(output);
          if (seen.has(identity)) return;
          seen.add(identity);
          selected.push(output);
        };
        parseActions(itemParameter(item, 'actions')).forEach(action => {
          add(source.find(output => output.action === action && isVideoMedia(output)));
          add(source.find(output => output.action === action && !isVideoMedia(output)));
        });
        source.filter(isVideoMedia).forEach(add);
        source.filter(output => !isVideoMedia(output)).forEach(add);
        return selected.slice(0, 4);
      }

      const firstVideo = source.find(isVideoMedia);
      if (firstVideo) {
        const firstImage = source.find(output => !isVideoMedia(output));
        return firstImage ? [firstVideo, firstImage] : [firstVideo];
      }
      const thumbnail = item.thumbnail && item.thumbnail.available !== false ? item.thumbnail : null;
      return [thumbnail || source[0]];
    }

    function mediaKindLabel(output) {
      const type = String(output?.type || '');
      if (outputLabels[type]) return outputLabels[type];
      const filename = String(output?.filename || '').toLowerCase();
      if (/geometry[_-]?guide|qwen[_-]?pose[_-]?guide/.test(filename)) {
        return 'Main_case 动作几何引导图（姿态/道具/机位）';
      }
      if (/subject[_-]?reference.*mask|reference[_-]?identity[_-]?mask/.test(filename)) {
        return 'SCAIL 主体参考遮罩（身份/外观区域）';
      }
      if (/subject[_-]?reference|reference[_-]?normalized/.test(filename)) {
        return 'SCAIL 主体参考图（身份/外观）';
      }
      return isVideoMedia(output) ? '视频' : '图片';
    }

    function mediaTitle(output) {
      const action = output?.action ? `${actionLabel(output.action)} · ` : '';
      const kind = mediaKindLabel(output);
      return `${action}${kind}`;
    }

    function taskTitle(item) {
      if (isSubjectReplacement(item)) {
        const actions = itemActions(item);
        return `主体替换任务${actions ? ` · ${actions}` : ''}`;
      }
      return item.request_kind === 'image' ? '图片生成任务' : '视频生成任务';
    }

    function loraLabel(item) {
      const strength = item.strength === null || item.strength === undefined
        ? '强度未记录'
        : Number(item.strength).toFixed(2);
      return `${item.name} · ${strength}`;
    }

    function addLoraChip(container, item) {
      const chip = element('span', `chip ${item.role || ''}${item.active ? '' : ' inactive'}`, loraLabel(item));
      chip.title = loraLabel(item);
      container.appendChild(chip);
    }

    function effectiveLoraAdjusted(item) {
      const effective = item.effective_lora || {};
      const stages = [];
      if (effective.canonical) stages.push(effective.canonical);
      if (Array.isArray(effective.poses)) stages.push(...effective.poses);
      return stages.some(stage => {
        const hasLora = Array.isArray(stage.loras) && stage.loras.length > 0;
        const scaleAdjusted = stage.strength_scale !== null
          && stage.strength_scale !== undefined
          && Number(stage.strength_scale) < 0.999;
        const modeAdjusted = stage.mode && item.user_lora_mode
          && stage.mode !== item.user_lora_mode;
        return hasLora && (scaleAdjusted || modeAdjusted);
      });
    }

    function effectiveLoraText(stage) {
      if (!stage) return '未记录';
      const loras = Array.isArray(stage.loras) ? stage.loras : [];
      const names = loras.length ? loras.map(loraLabel).join(' + ') : '未使用用户 LoRA';
      const scale = stage.strength_scale === null || stage.strength_scale === undefined
        ? '缩放未记录'
        : `整体缩放 ${Number(stage.strength_scale).toFixed(3)}`;
      const mode = stage.mode === 'stack'
        ? '叠加内置 LoRA'
        : (stage.mode === 'replace' ? '替换内置 LoRA' : '融合模式未记录');
      const sampling = stage.steps === null || stage.steps === undefined
        ? ''
        : `；采样 ${stage.steps} 步 / CFG ${formatValue(stage.cfg)} / 重绘 ${formatValue(stage.denoise)}`;
      return `${stage.profile || '配置未记录'}；${scale}；${mode}；${names}${sampling}`;
    }

    function missingMedia(message = '媒体文件不存在') {
      return element('div', 'missing', message);
    }

    function mediaImage(output, className = '') {
      const image = document.createElement('img');
      image.src = output.download_url;
      image.alt = mediaTitle(output) || output.filename;
      image.loading = 'lazy';
      image.decoding = 'async';
      if (className) image.className = className;
      return image;
    }

    function mediaVideo(output, controls = true) {
      const video = document.createElement('video');
      video.src = output.download_url;
      video.controls = controls;
      video.preload = 'metadata';
      video.playsInline = true;
      video.muted = !controls;
      video.setAttribute('aria-label', mediaTitle(output));
      return video;
    }

    function mediaElement(output, controls = true) {
      return isVideoMedia(output) ? mediaVideo(output, controls) : mediaImage(output);
    }

    function replaceBrokenMedia(media, message) {
      media.addEventListener('error', () => {
        const replacement = missingMedia(message);
        media.replaceWith(replacement);
      }, {once: true});
    }

    function appendLinkedMedia(container, output, controls = true) {
      const media = mediaElement(output, controls);
      replaceBrokenMedia(media, isVideoMedia(output) ? '视频加载失败' : '图片加载失败');
      if (isVideoMedia(output)) {
        container.appendChild(media);
        return media;
      }
      const link = document.createElement('a');
      link.href = output.download_url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.appendChild(media);
      container.appendChild(link);
      return media;
    }

    function renderCard(item) {
      const card = element('article', 'history-card');
      const preview = element('div', 'preview');
      const allMedia = itemMedia(item);
      const previewItems = cardMedia(item);
      if (previewItems.length) {
        const grid = element('div', `preview-media-grid${previewItems.length > 1 ? ' multi' : ''}`);
        previewItems.forEach(output => {
          const cell = element('div', 'preview-media-item');
          if (output.available === false) {
            cell.appendChild(missingMedia('媒体文件已丢失'));
          } else {
            const media = appendLinkedMedia(cell, output, true);
            if (isVideoMedia(output)) media.muted = true;
          }
          cell.appendChild(element('span', 'media-label', mediaTitle(output)));
          grid.appendChild(cell);
        });
        preview.appendChild(grid);
      } else {
        preview.appendChild(missingMedia('历史记录存在，但没有可展示的媒体文件'));
      }
      const availableMediaCount = allMedia.filter(output => output.available !== false).length;
      const hasVideo = allMedia.some(isVideoMedia);
      preview.appendChild(element(
        'span',
        'preview-count',
        `${availableMediaCount}/${allMedia.length} ${hasVideo ? '个媒体可用' : '张图片可用'}`
      ));

      const content = element('div', 'history-content');
      const top = element('div', 'card-top');
      const titleBlock = element('div');
      titleBlock.append(
        element('h2', '', taskTitle(item)),
        element('div', 'time', formatDate(item.created_at))
      );
      const itemStatus = item.status || 'unknown';
      const status = element('span', `status ${itemStatus}`, statusLabels[itemStatus] || itemStatus);
      top.append(titleBlock, status);
      content.appendChild(top);

      const prompt = element('div', 'prompt', item.prompt || '历史任务未记录提示词');
      content.appendChild(prompt);

      if (!isSubjectReplacement(item)) {
        const loras = element('div', 'chips');
        (Array.isArray(item.user_loras) ? item.user_loras : []).forEach(lora => addLoraChip(loras, lora));
        if (item.builtin_lora) addLoraChip(loras, item.builtin_lora);
        (Array.isArray(item.workflow_loras) ? item.workflow_loras : []).forEach(lora => addLoraChip(loras, lora));
        if (!loras.childElementCount) loras.appendChild(element('span', 'chip', 'LoRA 信息未记录'));
        if (item.user_lora_mode) {
          loras.appendChild(element('span', 'chip', item.user_lora_mode === 'stack' ? '叠加内置 LoRA' : '替换内置 LoRA'));
        }
        content.appendChild(loras);
      }

      const parameters = element('div', 'chips');
      const quickParameters = isSubjectReplacement(item)
        ? [
            ['模式', 'subject_replacement'],
            ['动作', itemActions(item) || itemParameter(item, 'actions')],
            ['主体配置', itemParameter(item, 'subject_profile')],
            ['SCAIL 引擎', itemParameter(item, 'generation_engine')],
            ['SCAIL 步数', itemParameter(item, 'scail_steps')],
            ['动作跟随强度', itemParameter(item, 'pose_strength')],
            ['Seed', itemParameter(item, 'seed')],
            ['分辨率', itemParameter(item, 'resolution')]
          ]
        : [
            ['Qwen', itemParameter(item, 'qwen_steps')],
            ['CFG', itemParameter(item, 'qwen_cfg')],
            ['Seed', itemParameter(item, 'seed')],
            ['分辨率', itemParameter(item, 'resolution')]
          ];
      quickParameters.forEach(([label, value]) => {
        parameters.appendChild(element('span', 'chip', `${label}: ${formatValue(value)}`));
      });
      if (item.prompt_translation?.applied) parameters.appendChild(element('span', 'chip', '中文已译为英文'));
      if (item.image_profile) parameters.appendChild(element('span', 'chip', `基准：${item.image_profile_label || item.image_profile}`));
      if (item.image_profile_revision) parameters.appendChild(element('span', 'chip', `版本：${item.image_profile_revision}`));
      if (item.identity_palette_guard) parameters.appendChild(element('span', 'chip', '自动毛色身份保护'));
      if (item.canonical_identity_palette_verdict === 'passed') {
        parameters.appendChild(element('span', 'chip', '基准图毛色已通过'));
      } else if (item.canonical_identity_palette_verdict === 'unavailable') {
        parameters.appendChild(element('span', 'chip', '基准图毛色检测不可用'));
      }
      if (Number(item.pose_identity_palette_warning_count || 0) > 0) {
        parameters.appendChild(element('span', 'chip', `毛色身份告警 ${item.pose_identity_palette_warning_count}`));
      }
      if (item.automatic_recovery_used) parameters.appendChild(element('span', 'chip', '使用过自动恢复'));
      if (effectiveLoraAdjusted(item)) parameters.appendChild(element('span', 'chip', '最终 LoRA 强度已调整'));
      if (Number(item.similarity_warning_count || 0) > 0) {
        parameters.appendChild(element('span', 'chip', `姿态相似度告警 ${item.similarity_warning_count}`));
      }
      content.appendChild(parameters);

      const bottom = element('div', 'card-bottom');
      bottom.appendChild(element('div', 'job-id', item.job_id));
      const button = element('button', 'detail-button', '查看全部媒体与参数');
      button.type = 'button';
      button.addEventListener('click', () => openDetail(item));
      bottom.appendChild(button);
      content.appendChild(bottom);
      card.append(preview, content);
      return card;
    }

    function appendDefinitionList(container, rows) {
      const list = document.createElement('dl');
      rows.forEach(([label, value]) => {
        list.append(element('dt', '', label), element('dd', '', formatValue(value)));
      });
      container.appendChild(list);
    }

    function setMainMedia(container, output, thumbnails, selectedButton) {
      container.replaceChildren();
      thumbnails.forEach(button => button.classList.toggle('active', button === selectedButton));
      if (output.available === false) {
        container.appendChild(missingMedia('媒体文件不存在'));
        return;
      }
      const media = appendLinkedMedia(container, output, true);
      if (!isVideoMedia(output)) media.loading = 'eager';
    }

    function moderationSection(item) {
      const section = element('div', 'section');
      section.appendChild(element('h3', '', '内容审核'));
      const record = item.content_moderation;
      if (!record?.required) {
        section.appendChild(element('p', 'review-message', '未审核：该任务没有机器审核及人工复核记录，不能作为审核接入证明。'));
        return section;
      }
      const stateNames = { input_pending: '等待输入审核', input_auditing: '正在审核输入', input_passed: '输入已通过', output_pending: '等待结果审核', output_auditing: '正在审核结果', pending_review: '待人工复核', released: '审核通过', blocked: '已拦截', moderation_error: '审核异常' };
      const actionNames = { allow: '机器通过', review: '待复核', block: '机器拦截', error: '审核异常', manual_allow: '人工通过', manual_block: '人工驳回' };
      appendDefinitionList(section, [
        ['审核状态', stateNames[record.state] || record.state],
        ['输入审核', actionNames[record.input?.action] || '未完成'],
        ['结果审核', actionNames[record.output?.action] || '未完成'],
        ['规则版本', record.policy_version],
        ['结果人工复核', record.require_output_review ? '必需' : '机器要求复核时必需']
      ]);
      section.appendChild(element('p', 'review-message', record.delivery_revoked ? '已拦截后续下载。此前下载或已发出的回调无法追回。' : '结果审核异步进行，生成完成即可下载并回调，无需等待机器审核或人工复核。'));
      appendDefinitionList(section, [['对外交付', record.delivery_revoked ? '后续交付已拦截' : '生成完成即交付'], ['实际生成状态', item.generation_status]]);
      const links = element('div', 'review-actions');
      const auditLink = element('a', 'button', '下载审核记录');
      auditLink.href = `${basePath}/api/jobs/video/${encodeURIComponent(item.job_id)}/moderation`;
      auditLink.download = `${item.job_id}-moderation.json`;
      const rulesLink = element('a', 'button', '查看生效规则');
      rulesLink.href = `${basePath}/api/moderation/rules`;
      rulesLink.target = '_blank';
      rulesLink.rel = 'noopener';
      links.append(auditLink, rulesLink);
      section.appendChild(links);
      const canDecide = ['pending_review', 'released', 'input_passed'].includes(record.state) && !['cancelled', 'failed'].includes(item.status);
      const canRetry = ['pending_review', 'blocked', 'moderation_error'].includes(item.status);
      if (canDecide || canRetry) {
        const note = element('textarea', 'review-note');
        note.placeholder = '填写复核依据或驳回原因（必填）。操作账号由后台记录。';
        note.maxLength = 2000;
        note.setAttribute('aria-label', '复核说明');
        if (canDecide) section.appendChild(note);
        const actions = element('div', 'review-actions');
        const message = element('p', 'review-message');
        message.setAttribute('role', 'status');
        async function submit(operation) {
          if (operation !== 'retry' && !note.value.trim()) { message.textContent = '请先填写复核说明。'; note.focus(); return; }
          Array.from(actions.children).forEach(button => button.disabled = true);
          message.textContent = '正在保存审核操作…';
          try {
            const response = await fetch(`${basePath}/api/jobs/video/${encodeURIComponent(item.job_id)}/moderation/${operation === 'retry' ? 'retry' : 'review'}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }, credentials: 'same-origin', cache: 'no-store',
              ...(operation === 'retry' ? {} : { body: JSON.stringify({ decision: operation, note: note.value.trim(), revision: record.revision }) })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : `HTTP ${response.status}`);
            $('detail').close();
            resetHistoryAndLoad();
          } catch (error) { message.textContent = error.message || '保存失败，请刷新后重试。'; }
          finally { Array.from(actions.children).forEach(button => button.disabled = false); }
        }
        function action(label, operation) {
          const button = element('button', 'button', label);
          button.type = 'button'; button.addEventListener('click', () => submit(operation)); actions.appendChild(button);
        }
        if (record.state === 'pending_review' && canDecide) action(record.active_stage === 'input' ? '审核通过并继续生成' : '审核通过', 'approve');
        if (canDecide) action('驳回并拦截', 'reject');
        if (canRetry) action('重新机器审核', 'retry');
        section.append(actions, message);
      }
      const details = element('details');
      details.appendChild(element('summary', '', '机器检测记录与人工操作记录'));
      details.appendChild(element('pre', 'audit-json', JSON.stringify(record, null, 2)));
      section.appendChild(details);
      return section;
    }

    function openDetail(item) {
      $('detailTitle').textContent = `${taskTitle(item)} · ${item.job_id}`;
      const body = $('detailBody');
      body.replaceChildren();

      const mediaPanel = element('section');
      const main = element('div', 'main-image');
      const thumbs = element('div', 'thumbs');
      const thumbButtons = [];
      const mediaItems = itemMedia(item);
      mediaItems.forEach(output => {
        const button = element('button', 'thumb');
        button.type = 'button';
        button.title = `${mediaTitle(output)} · ${output.filename || ''}`;
        if (output.available !== false) {
          const media = mediaElement(output, false);
          replaceBrokenMedia(media, '文件丢失');
          button.appendChild(media);
        } else {
          button.appendChild(missingMedia('缺失'));
        }
        button.addEventListener('click', () => setMainMedia(main, output, thumbButtons, button));
        thumbButtons.push(button);
        thumbs.appendChild(button);
      });
      if (!mediaItems.length) main.appendChild(missingMedia('该历史任务没有可展示的媒体记录'));
      mediaPanel.append(main, thumbs);

      const metadata = element('section', 'metadata');
      const summarySection = element('div', 'section');
      const summaryChips = element('div', 'chips');
      const itemStatus = item.status || 'unknown';
      summaryChips.append(
        element('span', `status ${itemStatus}`, statusLabels[itemStatus] || itemStatus),
        element('span', 'chip', item.request_kind === 'image' ? '图片任务' : '视频任务'),
        element('span', 'chip', item.source === 'legacy' ? '旧测试台记录' : '本地模型接口记录')
      );
      if (isSubjectReplacement(item)) {
        summaryChips.append(
          element('span', 'chip', '主体替换（subject_replacement）'),
          element('span', 'chip', `动作：${itemActions(item) || '未记录'}`),
          element('span', 'chip', `主体：${formatValue(itemParameter(item, 'subject_profile'))}`)
        );
      }
      if (item.prompt_translation?.applied) summaryChips.appendChild(element('span', 'chip', '中文已译为英文'));
      if (item.image_profile) summaryChips.appendChild(element('span', 'chip', `图片基准：${item.image_profile_label || item.image_profile}`));
      if (item.image_profile_revision) summaryChips.appendChild(element('span', 'chip', `基准版本：${item.image_profile_revision}`));
      if (item.identity_palette_guard) summaryChips.appendChild(element('span', 'chip', '自动毛色身份保护'));
      if (item.canonical_identity_palette_verdict === 'passed') {
        summaryChips.appendChild(element('span', 'chip', '基准图毛色已通过'));
      } else if (item.canonical_identity_palette_verdict === 'unavailable') {
        summaryChips.appendChild(element('span', 'chip', '基准图毛色检测不可用'));
      }
      summarySection.appendChild(summaryChips);
      const imageItems = mediaItems.filter(output => !isVideoMedia(output));
      const videoItems = mediaItems.filter(isVideoMedia);
      appendDefinitionList(summarySection, [
        ['任务 ID', item.job_id],
        ['当前阶段', item.stage],
        ['创建时间', formatDate(item.created_at)],
        ['开始时间', formatDate(item.started_at)],
        ['完成时间', formatDate(item.finished_at)],
        ['可用图片/GIF', `${imageItems.filter(output => output.available !== false).length}/${imageItems.length}`],
        ['可用视频', `${videoItems.filter(output => output.available !== false).length}/${videoItems.length}`]
      ]);
      metadata.appendChild(summarySection);
      metadata.appendChild(moderationSection(item));

      if (isSubjectReplacement(item)) {
        const assetRoleSection = element('div', 'section');
        assetRoleSection.appendChild(element('h3', '', '身份与动作标准（按任务来源区分）'));
        appendDefinitionList(assetRoleSection, [
          ['身份来源', parameterValue(item, 'effective_subject_source') || parameterValue(item, 'subject_source')],
          ['主体参考图 / 遮罩', '默认任务直接来自 Main_case 标准视频；上传任务来自上传主体'],
          ['Main_case 标准视频', '未上传时同时提供身份、毛发、动作与道具；上传时只提供动作几何'],
          ['本任务记录的动作标准', parameterValue(item, 'driving_templates')]
        ]);
        metadata.appendChild(assetRoleSection);
      }

      const promptSection = element('div', 'section');
      promptSection.append(
        element('h3', '', item.prompt_translation?.applied ? '原始提示词' : '完整提示词'),
        element('pre', 'full-prompt', item.prompt_original || item.prompt || '历史任务未记录')
      );
      if (item.prompt_translation?.applied && item.prompt_en) {
        promptSection.append(
          element('h3', '', '英文生图提示词'),
          element('pre', 'full-prompt', item.prompt_en)
        );
      }
      metadata.appendChild(promptSection);

      const userLoras = Array.isArray(item.user_loras) ? item.user_loras : [];
      const workflowLoras = Array.isArray(item.workflow_loras) ? item.workflow_loras : [];
      const effective = item.effective_lora || {};
      const hasLoraDetails = userLoras.length || workflowLoras.length || item.builtin_lora
        || effective.canonical || (Array.isArray(effective.poses) && effective.poses.length);
      if (!isSubjectReplacement(item) || hasLoraDetails) {
        const loraSection = element('div', 'section');
        loraSection.appendChild(element('h3', '', 'LoRA'));
        const loraChips = element('div', 'chips');
        userLoras.forEach(lora => addLoraChip(loraChips, lora));
        if (item.builtin_lora) addLoraChip(loraChips, item.builtin_lora);
        workflowLoras.forEach(lora => addLoraChip(loraChips, lora));
        if (!loraChips.childElementCount) loraChips.appendChild(element('span', 'chip', '历史任务未记录 LoRA'));
        loraSection.appendChild(loraChips);
        appendDefinitionList(loraSection, [
          ['图片基准', item.image_profile_label || item.image_profile],
          ['融合模式', item.user_lora_mode === 'stack' ? '叠加 LoRA' : (item.user_lora_mode === 'replace' ? '替换模式' : null)],
          ['用户 LoRA 数量', userLoras.length]
        ]);
        if (effective.canonical || (Array.isArray(effective.poses) && effective.poses.length)) {
          const effectiveRows = [];
          if (effective.canonical) {
            effectiveRows.push(['基准图实际 LoRA', effectiveLoraText(effective.canonical)]);
          }
          (effective.poses || []).forEach(stage => {
            effectiveRows.push([
              `姿态 ${stage.pose_index || '?'} 实际 LoRA`,
              effectiveLoraText(stage)
            ]);
          });
          appendDefinitionList(loraSection, effectiveRows);
        }
        metadata.appendChild(loraSection);
      }

      const parameterSection = element('div', 'section');
      parameterSection.appendChild(element('h3', '', '请求参数'));
      const displayedParameterOrder = isSubjectReplacement(item) ? subjectParameterOrder : parameterOrder;
      const parameterRows = displayedParameterOrder.map(key => {
        let value = parameterValue(item, key);
        if (!isSubjectReplacement(item) && item.request_kind === 'image' && ['wan_steps','wan_cfg','wan_shift','frames','fps','duration_seconds'].includes(key)) {
          value = '未使用（图片任务）';
        }
        return [parameterLabels[key], value];
      });
      appendDefinitionList(parameterSection, parameterRows);
      if (item.automatic_recovery_used) {
        parameterSection.appendChild(element('div', 'recovery-note', '该任务使用过自动恢复，最终生成某些图片时的 LoRA 或采样参数可能低于这里保存的请求参数。'));
      }
      if (item.background_removal_failed) {
        parameterSection.appendChild(element('div', 'recovery-note', '该任务有图片未能可靠抠图，历史中保留的是未抠图原图。'));
      }
      if (Number(item.similarity_warning_count || 0) > 0) {
        parameterSection.appendChild(element('div', 'recovery-note', `该任务有 ${item.similarity_warning_count} 个姿态留下相似度告警，请查看最终有效 LoRA 与恢复配置。`));
      }
      metadata.appendChild(parameterSection);

      const outputSection = element('div', 'section');
      outputSection.appendChild(element('h3', '', '全部媒体'));
      outputSection.appendChild(element('div', 'recovery-note', '这里只为任务 outputs 中实际记录的媒体生成链接；未记录的主体遮罩或 Main_case geometry guide 不补造下载链接。'));
      const links = element('div', 'output-links');
      mediaItems.forEach((output, index) => {
        if (output.available !== false) {
          const link = document.createElement('a');
          link.href = output.download_url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = `${index + 1}. ${mediaTitle(output)} · ${output.filename || '未命名文件'}`;
          links.appendChild(link);
        } else {
          links.appendChild(element('span', '', `${index + 1}. ${mediaTitle(output)} · ${output.filename || '未命名文件'}（文件不存在）`));
        }
      });
      if (!mediaItems.length) links.appendChild(element('span', '', '历史任务未记录输出媒体'));
      outputSection.appendChild(links);
      metadata.appendChild(outputSection);
      if (item.error) {
        const errorSection = element('div', 'section');
        errorSection.append(element('h3', '', '任务错误'), element('pre', 'full-prompt', item.error));
        metadata.appendChild(errorSection);
      }

      body.append(mediaPanel, metadata);
      if (mediaItems.length) {
        const firstIndex = Math.max(0, mediaItems.findIndex(output => output.available !== false));
        setMainMedia(main, mediaItems[firstIndex], thumbButtons, thumbButtons[firstIndex]);
      }
      $('detail').showModal();
    }

    function renderHistory(payload) {
      historyState.items = payload.items || [];
      historyState.nextCursor = payload.next_cursor || null;
      $('loading').hidden = true;
      $('error').style.display = 'none';
      $('historyList').replaceChildren();
      const hasItems = historyState.items.length > 0;
      $('historyList').hidden = !hasItems;
      $('empty').hidden = hasItems;
      if (hasItems) {
        historyState.items.forEach(item => $('historyList').appendChild(renderCard(item)));
      } else {
        const filtered = $('search').value.trim() || $('kind').value !== 'all' || $('state').value !== 'all' || $('lora').value !== 'all';
        $('emptyText').textContent = filtered ? '没有符合当前筛选条件的历史媒体。' : '完成一次生成后，图片、GIF 或视频会出现在这里。';
      }
      $('summary').replaceChildren(
        element('strong', '', `共 ${payload.total || 0} 个含媒体的任务`),
        document.createTextNode(`，当前显示 ${historyState.items.length} 个`)
      );
      $('previous').disabled = historyState.cursorStack.length === 0;
      $('next').disabled = !historyState.nextCursor;
      $('pageText').textContent = `第 ${historyState.page} 页`;
    }

    function historyUrl() {
      const url = new URL('api/history', window.location.href);
      url.searchParams.set('limit', '12');
      url.searchParams.set('q', $('search').value.trim());
      url.searchParams.set('kind', $('kind').value);
      url.searchParams.set('state', $('state').value);
      url.searchParams.set('lora', $('lora').value);
      if (historyState.cursor) url.searchParams.set('cursor', historyState.cursor);
      return url;
    }

    async function loadHistory() {
      if (historyState.controller) historyState.controller.abort();
      const controller = new AbortController();
      historyState.controller = controller;
      $('loading').hidden = false;
      $('empty').hidden = true;
      $('historyList').hidden = true;
      $('error').style.display = 'none';
      $('refresh').disabled = true;
      try {
        const response = await fetch(historyUrl(), {
          cache: 'no-store',
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderHistory(await response.json());
      } catch (error) {
        if (error.name === 'AbortError') return;
        $('loading').hidden = true;
        $('error').replaceChildren(
          element('div', '', '读取历史记录失败，请稍后重试。'),
          element('div', 'job-id', String(error.message || error))
        );
        $('error').style.display = 'grid';
      } finally {
        if (historyState.controller === controller) $('refresh').disabled = false;
      }
    }

    function resetHistoryAndLoad() {
      historyState.cursor = null;
      historyState.cursorStack = [];
      historyState.nextCursor = null;
      historyState.page = 1;
      loadHistory();
    }

    $('search').addEventListener('input', () => {
      clearTimeout(historyState.searchTimer);
      historyState.searchTimer = setTimeout(resetHistoryAndLoad, 300);
    });
    ['kind', 'state', 'lora'].forEach(id => $(id).addEventListener('change', resetHistoryAndLoad));
    $('refresh').addEventListener('click', resetHistoryAndLoad);
    $('previous').addEventListener('click', () => {
      if (!historyState.cursorStack.length) return;
      historyState.cursor = historyState.cursorStack.pop();
      historyState.page = Math.max(1, historyState.page - 1);
      loadHistory();
    });
    $('next').addEventListener('click', () => {
      if (!historyState.nextCursor) return;
      historyState.cursorStack.push(historyState.cursor);
      historyState.cursor = historyState.nextCursor;
      historyState.page += 1;
      loadHistory();
    });
    $('closeDetail').addEventListener('click', () => $('detail').close());
    $('detail').addEventListener('click', event => {
      if (event.target === $('detail')) $('detail').close();
    });
    loadHistory();
  </script>
</body>
</html>
