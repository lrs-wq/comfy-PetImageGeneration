# Label Studio reverse proxy only.
# This config intentionally does not expose Label Studio media/upload
# directories as static files, so application permissions stay in Label Studio.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Machine-specific JoyAI upstream credentials are deliberately kept outside
# Git. This file defines the $joyai_hls_upstream_authorization map.
include /etc/nginx/snippets/joyai-hls-upstream-authorization.conf;

upstream label_studio_app {
    server 127.0.0.1:8090;
    keepalive 32;
}

server {
    server_name 39.106.120.253 ai.hzzootech.com;

    client_max_body_size 20G;
    include /etc/nginx/snippets/gogelila-video-portal-proxy.conf;

    # Compress Label Studio HTML, JavaScript, CSS, JSON, and SVG responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /pet-dressup {
        return 301 /pet-dressup/;
    }

    location /pet-dressup/ {
        auth_basic "Pet Pipeline";
        auth_basic_user_file /etc/nginx/.htpasswd-pet-pipeline;
        client_max_body_size 25m;

        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /pet-generation {
        return 301 /pet-generation/;
    }

    location /pet-generation/ {
        client_max_body_size 5g;

        proxy_pass http://127.0.0.1:8050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /api/local-video {
        return 301 /api/local-video/docs;
    }

    location /api/local-video/ {
        client_max_body_size 16m;

        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header X-Content-Type-Options nosniff always;
    }

    # JoyAI VL Interaction lives under /joyai/ and is isolated from the
    # existing Label Studio and pet-pipeline routes.
    include /etc/nginx/snippets/joyai-location.conf;

    # Low-latency HLS preview for JoyAI. MediaMTX only listens on loopback;
    # Nginx keeps the public endpoint behind the same JoyAI Basic Auth.
    location = /joyai-hls {
        return 301 /joyai-hls/;
    }

    location ^~ /joyai-hls/ {
        auth_basic "JoyAI";
        auth_basic_user_file /etc/nginx/.htpasswd-joyai;

        proxy_pass http://127.0.0.1:8888/;
        proxy_redirect / /joyai-hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $joyai_hls_upstream_authorization;
        proxy_hide_header WWW-Authenticate;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # These are versioned frontend assets. Cache them in the browser so task
    # navigation does not download the complete Label Studio UI again.
    location ~* ^/(static|react-app)/ {
        proxy_pass http://label_studio_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
        proxy_buffering on;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        proxy_pass http://label_studio_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai.hzzootech.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.hzzootech.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    listen 80;
    server_name 39.106.120.253 ai.hzzootech.com;

    include /etc/nginx/snippets/gogelila-video-portal-redirect.conf;

    # Serve JoyAI directly on port 80 under its own path. All other domain
    # routes keep their existing HTTPS redirect and the bare IP keeps 404.
    include /etc/nginx/snippets/joyai-location.conf;

    location / {
        if ($host = ai.hzzootech.com) {
            return 301 https://$host$request_uri;
        }

        return 404;
    }
}
