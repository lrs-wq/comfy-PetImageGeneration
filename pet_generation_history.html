<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>历史图片 · 萌宠生成测试台</title>
  <style>
    :root {
      --bg: #f5f2eb;
      --paper: rgba(255, 255, 255, .94);
      --ink: #27251f;
      --muted: #756f64;
      --line: #ded8cc;
      --brand: #df6b48;
      --brand-dark: #a84329;
      --green: #2d7a5e;
      --blue: #376f9f;
      --red: #a53224;
      --shadow: 0 18px 50px rgba(73, 57, 34, .10);
      --checker: repeating-conic-gradient(#e9e9e7 0 25%, #fff 0 50%) 0/24px 24px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(249, 190, 115, .24), transparent 32rem),
        radial-gradient(circle at 100% 15%, rgba(110, 173, 151, .20), transparent 34rem),
        var(--bg);
      font: 15px/1.55 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .shell { width: min(1440px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 52px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(27px, 3vw, 42px); letter-spacing: -.04em; }
    h2, h3 { margin: 0; }
    .subtitle { margin: 7px 0 0; color: var(--muted); }
    .back-link {
      display: inline-flex; align-items: center; padding: 10px 15px; border: 1px solid #cbbca5;
      border-radius: 999px; color: var(--ink); background: #fffdf8; text-decoration: none;
      font-weight: 800; white-space: nowrap;
    }
    .back-link:hover { border-color: var(--brand); color: var(--brand-dark); background: #fff5ee; }
    .card { border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); }
    .toolbar { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(3, minmax(130px, 1fr)) auto; gap: 12px; padding: 16px; align-items: end; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    input, select {
      width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 10px 11px;
      color: var(--ink); background: white; outline: none;
    }
    input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(223,107,72,.12); }
    .refresh, .pager button, .detail-button, .close-button {
      border: 1px solid #cbbca5; border-radius: 11px; padding: 10px 14px; color: var(--ink);
      background: #fffdf8; cursor: pointer; font-weight: 800;
    }
    .refresh:hover, .pager button:hover:not(:disabled), .detail-button:hover, .close-button:hover {
      border-color: var(--brand); color: var(--brand-dark); background: #fff5ee;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 18px 2px 12px; color: var(--muted); }
    .summary strong { color: var(--ink); }
    .history-list { display: grid; gap: 16px; }
    .history-card {
      display: grid; grid-template-columns: minmax(240px, 330px) minmax(0, 1fr);
      overflow: hidden; border: 1px solid var(--line); border-radius: 19px; background: var(--paper);
      box-shadow: 0 10px 30px rgba(73,57,34,.07);
    }
    .preview {
      position: relative; min-height: 270px; display: grid; place-items: center; overflow: hidden;
      background: var(--checker); border-right: 1px solid var(--line);
    }
    .preview img { width: 100%; height: 100%; max-height: 340px; object-fit: contain; display: block; }
    .preview-count {
      position: absolute; right: 10px; bottom: 10px; padding: 5px 9px; border-radius: 999px;
      color: white; background: rgba(39,37,31,.76); font-size: 12px; font-weight: 800;
    }
    .missing { min-height: 170px; display: grid; place-items: center; padding: 20px; color: var(--muted); text-align: center; }
    .history-content { padding: 18px 20px; min-width: 0; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .card-top h2 { font-size: 17px; overflow-wrap: anywhere; }
    .time { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .status { display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; background: #eee; }
    .status.completed { color: var(--green); background: #e8f4ef; }
    .status.failed { color: var(--red); background: #fff0ed; }
    .status.cancelled { color: #765f3e; background: #f5eee2; }
    .status.running, .status.queued { color: var(--blue); background: #eaf3fb; }
    .prompt {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      margin: 14px 0 12px; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 9px 0; }
    .chip { max-width: 100%; padding: 5px 9px; border-radius: 999px; background: #f0ece4; color: #5d5549; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip.user { color: #7d3f29; background: #fff0e9; }
    .chip.builtin { color: #236b51; background: #e9f5ef; }
    .chip.workflow { color: #45678c; background: #edf3fa; }
    .chip.inactive { opacity: .55; text-decoration: line-through; }
    .card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 14px; }
    .job-id { color: var(--muted); font: 12px/1.4 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
    .detail-button { flex: 0 0 auto; padding: 8px 12px; }
    .notice, .empty, .loading {
      min-height: 240px; display: grid; place-items: center; padding: 32px; border: 1px dashed #cbbca5;
      border-radius: 18px; color: var(--muted); background: rgba(255,255,255,.62); text-align: center;
    }
    .notice { min-height: auto; display: none; color: var(--red); border-style: solid; border-color: #e7b5aa; background: #fff3f0; }
    .notice button { margin-top: 10px; }
    .loading::before { content: "正在读取历史记录…"; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 18px; }
    .pager span { min-width: 120px; color: var(--muted); text-align: center; }
    dialog {
      width: min(1180px, calc(100% - 24px)); max-height: calc(100vh - 28px); padding: 0;
      border: 1px solid var(--line); border-radius: 22px; color: var(--ink); background: #fbfaf7;
      box-shadow: 0 30px 90px rgba(36,28,17,.3);
    }
    dialog::backdrop { background: rgba(33,28,22,.58); backdrop-filter: blur(3px); }
    .dialog-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
    .dialog-head h2 { font-size: 18px; overflow-wrap: anywhere; }
    .close-button { padding: 7px 11px; }
    .dialog-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(330px, .8fr); gap: 18px; padding: 18px; overflow: auto; }
    .main-image {
      min-height: 430px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line);
      border-radius: 16px; background: var(--checker);
    }
    .main-image img { width: 100%; max-height: 620px; object-fit: contain; display: block; }
    .thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 9px; }
    .thumb {
      aspect-ratio: 1; padding: 0; overflow: hidden; border: 2px solid transparent; border-radius: 10px;
      background: var(--checker); cursor: pointer;
    }
    .thumb.active { border-color: var(--brand); }
    .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .metadata { min-width: 0; }
    .section { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .section:first-child { padding-top: 0; }
    .section:last-child { border-bottom: 0; }
    .section h3 { margin-bottom: 8px; font-size: 15px; }
    .full-prompt { margin: 0; padding: 11px 12px; border-radius: 11px; background: white; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
    .recovery-note { margin-top: 9px; padding: 9px 10px; border-radius: 10px; color: #805118; background: #fff6df; font-size: 12px; }
    dl { display: grid; grid-template-columns: minmax(110px, .8fr) minmax(0, 1.2fr); gap: 7px 12px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .output-links { display: grid; gap: 7px; }
    .output-links a { color: var(--brand-dark); text-decoration: none; overflow-wrap: anywhere; }
    .output-links a:hover { text-decoration: underline; }
    @media (max-width: 900px) {
      header { flex-direction: column; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar label:first-child { grid-column: 1 / -1; }
      .history-card { grid-template-columns: 250px minmax(0, 1fr); }
      .dialog-body { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .shell { width: min(100% - 18px, 1440px); padding-top: 18px; }
      .toolbar { grid-template-columns: 1fr; }
      .toolbar label:first-child { grid-column: auto; }
      .history-card { grid-template-columns: 1fr; }
      .preview { min-height: 240px; border-right: 0; border-bottom: 1px solid var(--line); }
      .card-top, .card-bottom { align-items: flex-start; flex-direction: column; }
      .detail-button { width: 100%; }
      .summary { align-items: flex-start; flex-direction: column; }
      .dialog-body { padding: 12px; }
      .main-image { min-height: 300px; }
      .thumbs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      dl { grid-template-columns: 1fr; gap: 2px; }
      dd { margin-bottom: 7px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>历史生成图片</h1>
        <p class="subtitle">按任务查看已生成图片、提示词、LoRA 名称与权重，以及当时保存的请求参数。</p>
      </div>
      <a class="back-link" href="./">返回生成测试台</a>
    </header>

    <section class="card toolbar" aria-label="历史筛选">
      <label>搜索
        <input id="search" type="search" maxlength="200" placeholder="提示词、任务 ID 或 LoRA 文件名">
      </label>
      <label>任务来源
        <select id="kind">
          <option value="all">全部任务</option>
          <option value="image">图片任务</option>
          <option value="video">视频任务首帧</option>
        </select>
      </label>
      <label>任务状态
        <select id="state">
          <option value="all">全部状态</option>
          <option value="completed">已完成</option>
          <option value="failed">失败但已有图片</option>
          <option value="cancelled">已取消但已有图片</option>
          <option value="active">进行中且已有图片</option>
        </select>
      </label>
      <label>用户 LoRA
        <select id="lora">
          <option value="all">全部</option>
          <option value="used">使用用户 LoRA</option>
          <option value="none">未使用用户 LoRA</option>
        </select>
      </label>
      <button id="refresh" class="refresh" type="button">刷新</button>
    </section>

    <div class="summary">
      <div id="summary"><strong>正在读取…</strong></div>
      <div>页面展示的是任务保存的请求参数；自动恢复后最终参数可能不同。</div>
    </div>
    <div id="error" class="notice" role="alert"></div>
    <div id="loading" class="loading"></div>
    <div id="empty" class="empty" hidden>
      <div><div style="font-size:48px">🐾</div><p id="emptyText">完成一次生成后，图片会出现在这里。</p></div>
    </div>
    <main id="historyList" class="history-list" hidden></main>
    <nav class="pager" aria-label="历史分页">
      <button id="previous" type="button" disabled>上一页</button>
      <span id="pageText">第 1 页</span>
      <button id="next" type="button" disabled>下一页</button>
    </nav>
  </div>

  <dialog id="detail">
    <div class="dialog-head">
      <h2 id="detailTitle">任务详情</h2>
      <button id="closeDetail" class="close-button" type="button">关闭</button>
    </div>
    <div id="detailBody" class="dialog-body"></div>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    const historyState = {
      cursor: null,
      cursorStack: [],
      nextCursor: null,
      page: 1,
      controller: null,
      searchTimer: null,
      items: []
    };

    const statusLabels = {
      completed: '已完成',
      failed: '生成失败',
      cancelled: '已取消',
      running: '生成中',
      queued: '排队中',
      unknown: '状态未知'
    };
    const outputLabels = {
      cartoon_reference: '卡通角色基准图',
      transparent_keyframe: '透明姿态首帧',
      keyframe: '姿态首帧',
      image: '未抠图姿态图',
      transparent_image: '透明图片',
      transparent_gif: '透明 GIF',
      transparent_apng: '透明 APNG'
    };
    const parameterLabels = {
      seed: '随机种子',
      image_profile: '图片基准配置',
      image_profile_revision: '图片基准版本',
      pose_prompt_source: '姿态提示词来源',
      pose_preset_ids: '姿态模板 ID',
      pose_seed_offsets: '姿态种子偏移',
      identity_palette_guard: '毛色身份保护',
      identity_palette_policy: '毛色身份策略',
      source_identity_palette: '参考图毛色签名',
      effective_canonical_identity_palette: '基准图毛色校验',
      canonical_identity_palette_verdict: '基准图毛色结论',
      pose_identity_palette_warning_count: '姿态毛色告警数',
      pose_count: '姿态数量',
      poses: '原始姿态',
      poses_en: '英文生图姿态',
      resolution: '输出分辨率',
      width: '宽度',
      height: '高度',
      output_format: '输出格式',
      skip_video: '跳过视频',
      generation_mode: '生成模式',
      qwen_steps: 'Qwen 步数',
      qwen_cfg: 'Qwen CFG',
      qwen_denoise: 'Qwen 重绘强度',
      qwen_sampler: 'Qwen 采样器',
      qwen_scheduler: 'Qwen 调度器',
      qwen_style_profile: 'Qwen 风格配置',
      qwen_model: 'Qwen 模型',
      wan_steps: 'Wan 步数',
      wan_cfg: 'Wan CFG',
      wan_shift: 'Wan Shift',
      frames: '视频帧数',
      fps: '视频 FPS',
      duration_seconds: '视频时长（秒）'
    };
    const parameterOrder = Object.keys(parameterLabels);

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function formatDate(value) {
      if (!value) return '历史任务未记录';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return new Intl.DateTimeFormat('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
      }).format(date);
    }

    function formatValue(value) {
      if (value === null || value === undefined || value === '') return '历史任务未记录';
      if (Array.isArray(value)) return value.length ? value.join('\n') : '无';
      if (typeof value === 'boolean') return value ? '是' : '否';
      return String(value);
    }

    function loraLabel(item) {
      const strength = item.strength === null || item.strength === undefined
        ? '强度未记录'
        : Number(item.strength).toFixed(2);
      return `${item.name} · ${strength}`;
    }

    function addLoraChip(container, item) {
      const chip = element('span', `chip ${item.role || ''}${item.active ? '' : ' inactive'}`, loraLabel(item));
      chip.title = loraLabel(item);
      container.appendChild(chip);
    }

    function effectiveLoraAdjusted(item) {
      const effective = item.effective_lora || {};
      const stages = [];
      if (effective.canonical) stages.push(effective.canonical);
      if (Array.isArray(effective.poses)) stages.push(...effective.poses);
      return stages.some(stage => {
        const hasLora = Array.isArray(stage.loras) && stage.loras.length > 0;
        const scaleAdjusted = stage.strength_scale !== null
          && stage.strength_scale !== undefined
          && Number(stage.strength_scale) < 0.999;
        const modeAdjusted = stage.mode && item.user_lora_mode
          && stage.mode !== item.user_lora_mode;
        return hasLora && (scaleAdjusted || modeAdjusted);
      });
    }

    function effectiveLoraText(stage) {
      if (!stage) return '未记录';
      const loras = Array.isArray(stage.loras) ? stage.loras : [];
      const names = loras.length ? loras.map(loraLabel).join(' + ') : '未使用用户 LoRA';
      const scale = stage.strength_scale === null || stage.strength_scale === undefined
        ? '缩放未记录'
        : `整体缩放 ${Number(stage.strength_scale).toFixed(3)}`;
      const mode = stage.mode === 'stack'
        ? '叠加内置 LoRA'
        : (stage.mode === 'replace' ? '替换内置 LoRA' : '融合模式未记录');
      const sampling = stage.steps === null || stage.steps === undefined
        ? ''
        : `；采样 ${stage.steps} 步 / CFG ${formatValue(stage.cfg)} / 重绘 ${formatValue(stage.denoise)}`;
      return `${stage.profile || '配置未记录'}；${scale}；${mode}；${names}${sampling}`;
    }

    function missingMedia(message = '图片文件不存在') {
      return element('div', 'missing', message);
    }

    function mediaImage(output, className = '') {
      const image = document.createElement('img');
      image.src = output.download_url;
      image.alt = outputLabels[output.type] || output.filename;
      image.loading = 'lazy';
      image.decoding = 'async';
      if (className) image.className = className;
      return image;
    }

    function replaceBrokenImage(image, message) {
      image.addEventListener('error', () => {
        const replacement = missingMedia(message);
        image.replaceWith(replacement);
      }, {once: true});
    }

    function renderCard(item) {
      const card = element('article', 'history-card');
      const preview = element('div', 'preview');
      const thumbnail = item.thumbnail;
      if (thumbnail && thumbnail.available) {
        const link = document.createElement('a');
        link.href = thumbnail.download_url;
        link.target = '_blank';
        link.rel = 'noopener';
        const image = mediaImage(thumbnail);
        replaceBrokenImage(image, '缩略图加载失败');
        link.appendChild(image);
        preview.appendChild(link);
      } else {
        preview.appendChild(missingMedia('历史记录存在，但图片文件已丢失'));
      }
      preview.appendChild(element('span', 'preview-count', `${item.available_image_count}/${item.image_count} 张可用`));

      const content = element('div', 'history-content');
      const top = element('div', 'card-top');
      const titleBlock = element('div');
      titleBlock.append(
        element('h2', '', item.request_kind === 'image' ? '图片生成任务' : '视频任务生成图片'),
        element('div', 'time', formatDate(item.created_at))
      );
      const status = element('span', `status ${item.status}`, statusLabels[item.status] || item.status);
      top.append(titleBlock, status);
      content.appendChild(top);

      const prompt = element('div', 'prompt', item.prompt || '历史任务未记录提示词');
      content.appendChild(prompt);

      const loras = element('div', 'chips');
      item.user_loras.forEach(lora => addLoraChip(loras, lora));
      if (item.builtin_lora) addLoraChip(loras, item.builtin_lora);
      item.workflow_loras.forEach(lora => addLoraChip(loras, lora));
      if (!loras.childElementCount) loras.appendChild(element('span', 'chip', 'LoRA 信息未记录'));
      if (item.user_lora_mode) {
        loras.appendChild(element('span', 'chip', item.user_lora_mode === 'stack' ? '叠加内置 LoRA' : '替换内置 LoRA'));
      }
      content.appendChild(loras);

      const parameters = element('div', 'chips');
      const quickParameters = [
        ['Qwen', item.parameters.qwen_steps],
        ['CFG', item.parameters.qwen_cfg],
        ['Seed', item.parameters.seed],
        ['分辨率', item.parameters.resolution]
      ];
      quickParameters.forEach(([label, value]) => {
        parameters.appendChild(element('span', 'chip', `${label}: ${formatValue(value)}`));
      });
      if (item.prompt_translation?.applied) parameters.appendChild(element('span', 'chip', '中文已译为英文'));
      if (item.image_profile) parameters.appendChild(element('span', 'chip', `基准：${item.image_profile_label || item.image_profile}`));
      if (item.image_profile_revision) parameters.appendChild(element('span', 'chip', `版本：${item.image_profile_revision}`));
      if (item.identity_palette_guard) parameters.appendChild(element('span', 'chip', '自动毛色身份保护'));
      if (item.canonical_identity_palette_verdict === 'passed') {
        parameters.appendChild(element('span', 'chip', '基准图毛色已通过'));
      } else if (item.canonical_identity_palette_verdict === 'unavailable') {
        parameters.appendChild(element('span', 'chip', '基准图毛色检测不可用'));
      }
      if (Number(item.pose_identity_palette_warning_count || 0) > 0) {
        parameters.appendChild(element('span', 'chip', `毛色身份告警 ${item.pose_identity_palette_warning_count}`));
      }
      if (item.automatic_recovery_used) parameters.appendChild(element('span', 'chip', '使用过自动恢复'));
      if (effectiveLoraAdjusted(item)) parameters.appendChild(element('span', 'chip', '最终 LoRA 强度已调整'));
      if (Number(item.similarity_warning_count || 0) > 0) {
        parameters.appendChild(element('span', 'chip', `姿态相似度告警 ${item.similarity_warning_count}`));
      }
      content.appendChild(parameters);

      const bottom = element('div', 'card-bottom');
      bottom.appendChild(element('div', 'job-id', item.job_id));
      const button = element('button', 'detail-button', '查看全部图片与参数');
      button.type = 'button';
      button.addEventListener('click', () => openDetail(item));
      bottom.appendChild(button);
      content.appendChild(bottom);
      card.append(preview, content);
      return card;
    }

    function appendDefinitionList(container, rows) {
      const list = document.createElement('dl');
      rows.forEach(([label, value]) => {
        list.append(element('dt', '', label), element('dd', '', formatValue(value)));
      });
      container.appendChild(list);
    }

    function setMainImage(container, output, thumbnails, selectedButton) {
      container.replaceChildren();
      thumbnails.forEach(button => button.classList.toggle('active', button === selectedButton));
      if (!output.available) {
        container.appendChild(missingMedia('图片文件不存在'));
        return;
      }
      const link = document.createElement('a');
      link.href = output.download_url;
      link.target = '_blank';
      link.rel = 'noopener';
      const image = mediaImage(output);
      image.loading = 'eager';
      replaceBrokenImage(image, '图片加载失败');
      link.appendChild(image);
      container.appendChild(link);
    }

    function openDetail(item) {
      $('detailTitle').textContent = `${item.request_kind === 'image' ? '图片任务' : '视频任务'} · ${item.job_id}`;
      const body = $('detailBody');
      body.replaceChildren();

      const mediaPanel = element('section');
      const main = element('div', 'main-image');
      const thumbs = element('div', 'thumbs');
      const thumbButtons = [];
      item.images.forEach(output => {
        const button = element('button', 'thumb');
        button.type = 'button';
        button.title = outputLabels[output.type] || output.filename;
        if (output.available) {
          const image = mediaImage(output);
          replaceBrokenImage(image, '文件丢失');
          button.appendChild(image);
        } else {
          button.appendChild(missingMedia('缺失'));
        }
        button.addEventListener('click', () => setMainImage(main, output, thumbButtons, button));
        thumbButtons.push(button);
        thumbs.appendChild(button);
      });
      mediaPanel.append(main, thumbs);

      const metadata = element('section', 'metadata');
      const summarySection = element('div', 'section');
      const summaryChips = element('div', 'chips');
      summaryChips.append(
        element('span', `status ${item.status}`, statusLabels[item.status] || item.status),
        element('span', 'chip', item.request_kind === 'image' ? '图片任务' : '视频任务'),
        element('span', 'chip', item.source === 'legacy' ? '旧测试台记录' : '本地模型接口记录')
      );
      if (item.prompt_translation?.applied) summaryChips.appendChild(element('span', 'chip', '中文已译为英文'));
      if (item.image_profile) summaryChips.appendChild(element('span', 'chip', `图片基准：${item.image_profile_label || item.image_profile}`));
      if (item.image_profile_revision) summaryChips.appendChild(element('span', 'chip', `基准版本：${item.image_profile_revision}`));
      if (item.identity_palette_guard) summaryChips.appendChild(element('span', 'chip', '自动毛色身份保护'));
      if (item.canonical_identity_palette_verdict === 'passed') {
        summaryChips.appendChild(element('span', 'chip', '基准图毛色已通过'));
      } else if (item.canonical_identity_palette_verdict === 'unavailable') {
        summaryChips.appendChild(element('span', 'chip', '基准图毛色检测不可用'));
      }
      summarySection.appendChild(summaryChips);
      appendDefinitionList(summarySection, [
        ['任务 ID', item.job_id],
        ['创建时间', formatDate(item.created_at)],
        ['开始时间', formatDate(item.started_at)],
        ['完成时间', formatDate(item.finished_at)],
        ['可用图片', `${item.available_image_count}/${item.image_count}`]
      ]);
      metadata.appendChild(summarySection);

      const promptSection = element('div', 'section');
      promptSection.append(
        element('h3', '', item.prompt_translation?.applied ? '原始提示词' : '完整提示词'),
        element('pre', 'full-prompt', item.prompt_original || item.prompt || '历史任务未记录')
      );
      if (item.prompt_translation?.applied && item.prompt_en) {
        promptSection.append(
          element('h3', '', '英文生图提示词'),
          element('pre', 'full-prompt', item.prompt_en)
        );
      }
      metadata.appendChild(promptSection);

      const loraSection = element('div', 'section');
      loraSection.appendChild(element('h3', '', 'LoRA'));
      const loraChips = element('div', 'chips');
      item.user_loras.forEach(lora => addLoraChip(loraChips, lora));
      if (item.builtin_lora) addLoraChip(loraChips, item.builtin_lora);
      item.workflow_loras.forEach(lora => addLoraChip(loraChips, lora));
      if (!loraChips.childElementCount) loraChips.appendChild(element('span', 'chip', '历史任务未记录 LoRA'));
      loraSection.appendChild(loraChips);
      appendDefinitionList(loraSection, [
        ['图片基准', item.image_profile_label || item.image_profile],
        ['融合模式', item.user_lora_mode === 'stack' ? '叠加 LoRA' : (item.user_lora_mode === 'replace' ? '替换模式' : null)],
        ['用户 LoRA 数量', item.user_loras.length]
      ]);
      const effective = item.effective_lora || {};
      if (effective.canonical || (Array.isArray(effective.poses) && effective.poses.length)) {
        const effectiveRows = [];
        if (effective.canonical) {
          effectiveRows.push(['基准图实际 LoRA', effectiveLoraText(effective.canonical)]);
        }
        (effective.poses || []).forEach(stage => {
          effectiveRows.push([
            `姿态 ${stage.pose_index || '?'} 实际 LoRA`,
            effectiveLoraText(stage)
          ]);
        });
        appendDefinitionList(loraSection, effectiveRows);
      }
      metadata.appendChild(loraSection);

      const parameterSection = element('div', 'section');
      parameterSection.appendChild(element('h3', '', '请求参数'));
      const parameterRows = parameterOrder.map(key => {
        let value = item.parameters[key];
        if (item.request_kind === 'image' && ['wan_steps','wan_cfg','wan_shift','frames','fps','duration_seconds'].includes(key)) {
          value = '未使用（图片任务）';
        }
        return [parameterLabels[key], value];
      });
      appendDefinitionList(parameterSection, parameterRows);
      if (item.automatic_recovery_used) {
        parameterSection.appendChild(element('div', 'recovery-note', '该任务使用过自动恢复，最终生成某些图片时的 LoRA 或采样参数可能低于这里保存的请求参数。'));
      }
      if (item.background_removal_failed) {
        parameterSection.appendChild(element('div', 'recovery-note', '该任务有图片未能可靠抠图，历史中保留的是未抠图原图。'));
      }
      if (Number(item.similarity_warning_count || 0) > 0) {
        parameterSection.appendChild(element('div', 'recovery-note', `该任务有 ${item.similarity_warning_count} 个姿态留下相似度告警，请查看最终有效 LoRA 与恢复配置。`));
      }
      metadata.appendChild(parameterSection);

      const outputSection = element('div', 'section');
      outputSection.appendChild(element('h3', '', '全部图片'));
      const links = element('div', 'output-links');
      item.images.forEach((output, index) => {
        if (output.available) {
          const link = document.createElement('a');
          link.href = output.download_url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = `${index + 1}. ${outputLabels[output.type] || output.type} · ${output.filename}`;
          links.appendChild(link);
        } else {
          links.appendChild(element('span', '', `${index + 1}. ${output.filename}（文件不存在）`));
        }
      });
      outputSection.appendChild(links);
      metadata.appendChild(outputSection);
      if (item.error) {
        const errorSection = element('div', 'section');
        errorSection.append(element('h3', '', '任务错误'), element('pre', 'full-prompt', item.error));
        metadata.appendChild(errorSection);
      }

      body.append(mediaPanel, metadata);
      if (item.images.length) setMainImage(main, item.images[0], thumbButtons, thumbButtons[0]);
      $('detail').showModal();
    }

    function renderHistory(payload) {
      historyState.items = payload.items || [];
      historyState.nextCursor = payload.next_cursor || null;
      $('loading').hidden = true;
      $('error').style.display = 'none';
      $('historyList').replaceChildren();
      const hasItems = historyState.items.length > 0;
      $('historyList').hidden = !hasItems;
      $('empty').hidden = hasItems;
      if (hasItems) {
        historyState.items.forEach(item => $('historyList').appendChild(renderCard(item)));
      } else {
        const filtered = $('search').value.trim() || $('kind').value !== 'all' || $('state').value !== 'all' || $('lora').value !== 'all';
        $('emptyText').textContent = filtered ? '没有符合当前筛选条件的历史图片。' : '完成一次生成后，图片会出现在这里。';
      }
      $('summary').replaceChildren(
        element('strong', '', `共 ${payload.total || 0} 个含图片的任务`),
        document.createTextNode(`，当前显示 ${historyState.items.length} 个`)
      );
      $('previous').disabled = historyState.cursorStack.length === 0;
      $('next').disabled = !historyState.nextCursor;
      $('pageText').textContent = `第 ${historyState.page} 页`;
    }

    function historyUrl() {
      const url = new URL('api/history', window.location.href);
      url.searchParams.set('limit', '12');
      url.searchParams.set('q', $('search').value.trim());
      url.searchParams.set('kind', $('kind').value);
      url.searchParams.set('state', $('state').value);
      url.searchParams.set('lora', $('lora').value);
      if (historyState.cursor) url.searchParams.set('cursor', historyState.cursor);
      return url;
    }

    async function loadHistory() {
      if (historyState.controller) historyState.controller.abort();
      const controller = new AbortController();
      historyState.controller = controller;
      $('loading').hidden = false;
      $('empty').hidden = true;
      $('historyList').hidden = true;
      $('error').style.display = 'none';
      $('refresh').disabled = true;
      try {
        const response = await fetch(historyUrl(), {
          cache: 'no-store',
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderHistory(await response.json());
      } catch (error) {
        if (error.name === 'AbortError') return;
        $('loading').hidden = true;
        $('error').replaceChildren(
          element('div', '', '读取历史记录失败，请稍后重试。'),
          element('div', 'job-id', String(error.message || error))
        );
        $('error').style.display = 'grid';
      } finally {
        if (historyState.controller === controller) $('refresh').disabled = false;
      }
    }

    function resetHistoryAndLoad() {
      historyState.cursor = null;
      historyState.cursorStack = [];
      historyState.nextCursor = null;
      historyState.page = 1;
      loadHistory();
    }

    $('search').addEventListener('input', () => {
      clearTimeout(historyState.searchTimer);
      historyState.searchTimer = setTimeout(resetHistoryAndLoad, 300);
    });
    ['kind', 'state', 'lora'].forEach(id => $(id).addEventListener('change', resetHistoryAndLoad));
    $('refresh').addEventListener('click', resetHistoryAndLoad);
    $('previous').addEventListener('click', () => {
      if (!historyState.cursorStack.length) return;
      historyState.cursor = historyState.cursorStack.pop();
      historyState.page = Math.max(1, historyState.page - 1);
      loadHistory();
    });
    $('next').addEventListener('click', () => {
      if (!historyState.nextCursor) return;
      historyState.cursorStack.push(historyState.cursor);
      historyState.cursor = historyState.nextCursor;
      historyState.page += 1;
      loadHistory();
    });
    $('closeDetail').addEventListener('click', () => $('detail').close());
    $('detail').addEventListener('click', event => {
      if (event.target === $('detail')) $('detail').close();
    });
    loadHistory();
  </script>
</body>
</html>
